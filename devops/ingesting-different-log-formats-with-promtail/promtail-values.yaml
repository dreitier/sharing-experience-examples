# From "Ingesting different log formats with Promtail": https://sharing-experience.com/en/knowledge-base/devops/logging/ingesting-different-log-formats-with-promtail
pipelineStages:
  - match:
      selector: '{app="myapp"}'
      stages:
        # @see https://community.grafana.com/t/what-is-the-correct-way-to-parse-json-logs-in-loki-promtail/51974
        - docker: {}
        # @see https://github.com/grafana/loki/issues/3993
        - replace:
            expression: '(\n)'
            replace: ""
        - match:
            selector: '{container=~"myapp-.+-application"}'
            stages:
              - match:
                  # Application output
                  selector: '{stream="stdout"}'
                  stages:
                    - multiline:
                        firstline: '^\d{4}-\d{2}-\d{2}\s\d{1,2}\:\d{2}\:\d{2},\d{3}.+'
                        max_wait_time: 3s
                    - regex:
                        expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2}\s\d{1,2}\:\d{2}\:\d{2},\d{3})\s+\[(?P<thread>[\w\d\-\[\]]+)\]\s(?P<level>\w+)\s+(?P<logger>[\w\.]+)\s+-\s(?P<message>(?s:.*))$'
                    - timestamp:
                        source: timestamp
                        format: '2006-01-02 15:04:05,999'
                        location: Europe/Berlin
                    - labels:
                        thread: thread
                        level: level
                        logger: logger
                    - output:
                        source: message
              - match:
                  # Tomcat output
                  selector: '{stream="stderr"}'
                  stages:
                    - multiline:
                        firstline: '^\w+\s\d{2},\s\d{4}\s\d{1,2}:\d{1,2}:\d{1,2}\s\w{2}.+'
                        max_wait_time: 3s
                    - regex:
                        expression: '^(?P<timestamp>\w+\s\d{2},\s\d{4}\s\d{1,2}:\d{1,2}:\d{1,2}\s\w{2})\s(?P<logger>[\w\.]+)\s(?P<thread>\w+)\n(?P<level>\w+):\s(?P<message>(?s:.*))$'
                    - timestamp:
                        source: timestamp
                        format: 'Jan 2, 2006 3:04:05 PM' # e.g. Mar 16, 2023 5:08:52 PM
                        location: Europe/Berlin
                    - labels:
                        thread: thread
                        level: level
                        logger: logger
                    - output:
                        source: message
