# From "Your alerting is broken and nobody notices: A dead man's switch for Alertmanager": https://sharing-experience.com/en/knowledge-base/incident-readiness/dead-mans-switch-for-alertmanager
route:
  receiver: default
  routes:
    # dead man's switch: forward the always-firing Watchdog to the external heartbeat check
    - matchers:
        - alertname = "Watchdog"
      receiver: deadmans-switch
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

receivers:
  - name: default
    # your regular receivers (e-mail, chat, on-call)
  - name: deadmans-switch
    webhook_configs:
      - url: https://hc-ping.com/<your-check-uuid>
        send_resolved: false
